{{define "content"}}{{$d := .Data}}
<h1>{{t "New API Token"}}</h1>
<p>{{th "Copy this token for <strong>{{.Name}}</strong> now. It won't be shown again." "Name" $d.Label}}</p>
<p><code class="secret">{{$d.Token}}</code></p>
<p>{{th "<a class=\"button\" href=\"/settings/integrations?section=api#api\">Done</a>"}}</p>
{{end}}
