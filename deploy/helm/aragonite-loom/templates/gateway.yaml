apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loom.name" . }}-gateway
  labels:
    {{- include "loom.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "loom.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "loom.selector" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loom
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: LOOM_ROLE, value: gateway }
            - name: LOOM_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "loom.secretName" . }}, key: database-url } }
            - { name: LOOM_OBJECT_ENDPOINT, value: {{ .Values.objectStore.endpoint | quote }} }
            - { name: LOOM_OBJECT_REGION, value: {{ .Values.objectStore.region | quote }} }
            - { name: LOOM_OBJECT_BUCKET, value: {{ .Values.objectStore.bucket | quote }} }
            - name: LOOM_OBJECT_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "loom.secretName" . }}, key: object-access-key } }
            - name: LOOM_OBJECT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "loom.secretName" . }}, key: object-secret-key } }
            - { name: LOOM_OBJECT_PATH_STYLE, value: {{ .Values.objectStore.pathStyle | quote }} }
          ports:
            - { name: main, containerPort: 8443 }
            - { name: spc, containerPort: 8089 }
          readinessProbe: { httpGet: { path: /readyz, port: main }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /livez, port: main }, periodSeconds: 20 }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: scratch, mountPath: /tmp }
      volumes:
        - name: scratch
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loom.name" . }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "loom.selector" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - { name: main, port: {{ .Values.service.mainPort }}, targetPort: main }
    - { name: spc, port: {{ .Values.service.spcPort }}, targetPort: spc }
