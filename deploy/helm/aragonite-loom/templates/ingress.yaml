{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "loom.name" . }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts: [{{ .Values.ingress.mainHost | quote }}, {{ .Values.ingress.spcHost | quote }}]
  rules:
    - host: {{ .Values.ingress.mainHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "loom.name" . }}, port: { name: main } } }
    - host: {{ .Values.ingress.spcHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "loom.name" . }}, port: { name: spc } } }
{{- end }}
