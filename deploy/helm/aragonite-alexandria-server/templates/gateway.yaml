apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alexandria.name" . }}-gateway
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "alexandria.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "alexandria.selector" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        {{- include "alexandria.podSecurity" . | nindent 8 }}
      containers:
        - name: alexandria
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: ALEXANDRIA_ROLE, value: gateway }
            {{- include "alexandria.runtimeEnv" . | nindent 12 }}
          ports:
            - { name: main, containerPort: 8443 }
            - { name: spc, containerPort: 8089 }
          readinessProbe: { httpGet: { path: /readyz, port: main }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /livez, port: main }, periodSeconds: 20 }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            {{- include "alexandria.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: scratch, mountPath: /tmp }
      volumes:
        - name: scratch
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alexandria.name" . }}
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "alexandria.selector" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - { name: main, port: {{ .Values.service.mainPort }}, targetPort: main }
    - { name: spc, port: {{ .Values.service.spcPort }}, targetPort: spc }
