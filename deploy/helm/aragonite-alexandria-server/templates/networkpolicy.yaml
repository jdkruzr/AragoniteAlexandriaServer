{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alexandria.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "alexandria.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8443 }
        - { protocol: TCP, port: 8089 }
  egress:
    - {}
{{- end }}
