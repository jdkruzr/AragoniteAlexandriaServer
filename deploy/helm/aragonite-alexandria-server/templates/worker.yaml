{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alexandria.name" . }}-worker
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "alexandria.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "alexandria.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        {{- include "alexandria.podSecurity" . | nindent 8 }}
      containers:
        - name: alexandria
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: ALEXANDRIA_ROLE, value: worker }
            - name: ALEXANDRIA_WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- include "alexandria.runtimeEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "alexandria.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: scratch, mountPath: /tmp }
      volumes:
        - name: scratch
          emptyDir: { sizeLimit: 4Gi }
{{- end }}
