name: aragonite-alexandria-server

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: alexandria
      POSTGRES_USER: alexandria
      POSTGRES_PASSWORD: ${ALEXANDRIA_POSTGRES_PASSWORD:-alexandria-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandria -d alexandria"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ALEXANDRIA_POSTGRES_PORT:-15432}:5432"
    restart: unless-stopped

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:3.85
    # Without an identity file SeaweedFS accepts any credentials; generate one from .env so the
    # bucket requires the same key pair the server uses. The secret never lands in the image.
    environment:
      S3_ACCESS_KEY: ${ALEXANDRIA_OBJECT_ACCESS_KEY:?Set ALEXANDRIA_OBJECT_ACCESS_KEY (install.sh generates it)}
      S3_SECRET_KEY: ${ALEXANDRIA_OBJECT_SECRET_KEY:?Set ALEXANDRIA_OBJECT_SECRET_KEY (install.sh generates it)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf '{"identities":[{"name":"alexandria","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
        -volume.max=0 -volume.minFreeSpace=5 -master.volumeSizeLimitMB=1024 -master.volumePreallocate=false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 20s
    volumes:
      - object-data:/data
    restart: unless-stopped

  alexandria:
    build:
      context: ../..
    image: aragonite-alexandria-server:local
    environment: &server-environment
      ALEXANDRIA_ROLE: all
      ALEXANDRIA_DATABASE_URL: postgres://alexandria_runtime:${ALEXANDRIA_RUNTIME_PASSWORD:?Set a random hexadecimal runtime password of at least 24 characters}@postgres:5432/alexandria?sslmode=disable
      ALEXANDRIA_OBJECT_ENDPOINT: http://seaweedfs:8333
      ALEXANDRIA_OBJECT_REGION: us-east-1
      ALEXANDRIA_OBJECT_BUCKET: aragonite-alexandria-server
      ALEXANDRIA_OBJECT_ACCESS_KEY: ${ALEXANDRIA_OBJECT_ACCESS_KEY:?Set ALEXANDRIA_OBJECT_ACCESS_KEY}
      ALEXANDRIA_OBJECT_SECRET_KEY: ${ALEXANDRIA_OBJECT_SECRET_KEY:?Set ALEXANDRIA_OBJECT_SECRET_KEY}
      ALEXANDRIA_OBJECT_PATH_STYLE: "true"
      ALEXANDRIA_LISTEN_ADDR: :8443
      ALEXANDRIA_SPC_LISTEN_ADDR: :8089
      ALEXANDRIA_MAX_CONNECTIONS: ${ALEXANDRIA_MAX_CONNECTIONS:-16}
      ALEXANDRIA_PUBLIC_URL: ${ALEXANDRIA_PUBLIC_URL:-}
      ALEXANDRIA_OCR_URL: ${ALEXANDRIA_OCR_URL:-}
      ALEXANDRIA_OCR_API_KEY: ${ALEXANDRIA_OCR_API_KEY:-}
      ALEXANDRIA_OCR_MODEL: ${ALEXANDRIA_OCR_MODEL:-}
      ALEXANDRIA_OCR_FORMAT: ${ALEXANDRIA_OCR_FORMAT:-anthropic}
      ALEXANDRIA_OCR_PROMPT: ${ALEXANDRIA_OCR_PROMPT:-}
      ALEXANDRIA_EMBED_URL: ${ALEXANDRIA_EMBED_URL:-}
      ALEXANDRIA_EMBED_MODEL: ${ALEXANDRIA_EMBED_MODEL:-nomic-embed-text:v1.5}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-runtime:
        condition: service_completed_successfully
      init-storage:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ALEXANDRIA_MAIN_PORT:-18443}:8443"
      - "127.0.0.1:${ALEXANDRIA_SPC_PORT:-18089}:8089"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    image: aragonite-alexandria-server:local
    command: ["migrate"]
    environment:
      <<: *server-environment
      ALEXANDRIA_DATABASE_URL: postgres://alexandria:${ALEXANDRIA_POSTGRES_PASSWORD:-alexandria-local-only}@postgres:5432/alexandria?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-runtime:
    image: aragonite-alexandria-server:local
    command: ["bootstrap-runtime"]
    environment:
      <<: *server-environment
      ALEXANDRIA_DATABASE_URL: postgres://alexandria:${ALEXANDRIA_POSTGRES_PASSWORD:-alexandria-local-only}@postgres:5432/alexandria?sslmode=disable
      ALEXANDRIA_RUNTIME_PASSWORD: ${ALEXANDRIA_RUNTIME_PASSWORD:?Set the runtime password}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  init-storage:
    image: aragonite-alexandria-server:local
    command: ["init-storage"]
    environment: *server-environment
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # Run once (install.sh does): printf "%s" "$PASSWORD" | podman compose --profile setup run --rm --no-deps -T seed-admin
  # The password arrives on stdin, so it is never stored in .env or the container definition.
  seed-admin:
    image: aragonite-alexandria-server:local
    profiles: ["setup"]
    command: ["seed-user", "--username", "${ALEXANDRIA_ADMIN_USERNAME:-admin}", "--password-file", "/dev/stdin"]
    stdin_open: true
    environment:
      <<: *server-environment
      ALEXANDRIA_DATABASE_URL: postgres://alexandria:${ALEXANDRIA_POSTGRES_PASSWORD:-alexandria-local-only}@postgres:5432/alexandria?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Object mirror for backup.sh / restore.sh (run with --no-deps so they never
  # start or recreate the live services). The database side is pg_dump and
  # pg_restore inside the running postgres container.
  backup-objects:
    image: docker.io/rclone/rclone:1.68
    profiles: ["backup"]
    environment: &rclone-environment
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: SeaweedFS
      RCLONE_CONFIG_STORE_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${ALEXANDRIA_OBJECT_ACCESS_KEY:-}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${ALEXANDRIA_OBJECT_SECRET_KEY:-}
      RCLONE_CONFIG_STORE_FORCE_PATH_STYLE: "true"
    command: ["sync", "store:aragonite-alexandria-server", "/backup/objects", "--checksum"]
    volumes:
      - ${ALEXANDRIA_BACKUP_DIR:-./backups}:/backup
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  restore-objects:
    image: docker.io/rclone/rclone:1.68
    profiles: ["restore"]
    environment: *rclone-environment
    command: ["copy", "/backup/objects", "store:aragonite-alexandria-server", "--checksum"]
    volumes:
      - ${ALEXANDRIA_BACKUP_DIR:-./backups}:/backup:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
    name: ${ALEXANDRIA_POSTGRES_VOLUME:-aragonite-alexandria-server-postgres-data}
  object-data:
    name: ${ALEXANDRIA_OBJECT_VOLUME:-aragonite-alexandria-server-object-data}
